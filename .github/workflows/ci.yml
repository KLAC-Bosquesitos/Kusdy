# CI de Kusdy: cada push y cada Pull Request se verifica en una máquina limpia.
# Basado en el ci.yml de inkash (tag s14-06-ci).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # botón "Run workflow" en la pestaña Actions

# Si haces push dos veces seguidas a la misma rama, se cancela la corrida vieja.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# La app Flutter vive en la subcarpeta kusdy/, no en la raíz del repo.
# Sin esto, flutter pub get no encuentra el pubspec.yaml y el check sale rojo.
defaults:
  run:
    working-directory: kusdy

jobs:
  calidad:
    name: Formato, análisis y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Misma versión que en las computadoras del equipo: builds reproducibles.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Formato (dart format)
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análisis estático (flutter analyze)
        run: flutter analyze

      - name: Pruebas (flutter test)
        run: flutter test --reporter expanded

  apk:
    name: APK de prueba
    needs: calidad # solo si la calidad pasó
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - run: flutter pub get

      # APK debug: sirve para probar en el celular de Freddy. El build firmado
      # para Google Play es de la fase de despliegue.
      - name: Compilar APK
        run: flutter build apk --debug

      # upload-artifact no usa working-directory: la ruta va desde la raíz.
      - uses: actions/upload-artifact@v4
        with:
          name: kusdy-apk-${{ github.sha }}
          path: kusdy/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
